function buildTabbar(){
  const bar=$("#tabbar");bar.innerHTML="";
  TABS.forEach(t=>{const b=el("button","tab"+(t.id===STATE.activeTab?" on":""));
    b.dataset.tab=t.id;b.innerHTML=`<span class="ico">${t.ico}</span>${t.name}`;
    b.addEventListener("click",()=>switchTab(t.id));bar.append(b);});
}
function switchTab(id){
  if(STATE._erodeAnim){clearInterval(STATE._erodeAnim);STATE._erodeAnim=null;}
  STATE.activeTab=id;
  $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===id));
  renderControls();renderViz();renderHero();
}
function renderControls(){
  const box=$("#controls");box.innerHTML="";box.classList.add("fade");
  box.append(TAB_FNS[STATE.activeTab].c());
  setTimeout(()=>box.classList.remove("fade"),300);
}
function renderViz(){
  const box=$("#viz");box.innerHTML="";box.classList.add("fade");
  box.append(TAB_FNS[STATE.activeTab].v());
  setTimeout(()=>box.classList.remove("fade"),300);
}
/* refreshViz: re-render only the viz panel (after a control changes) */
function refreshViz(){renderViz();}

function updateNuclideUI(){
  const nuc=NUCLIDES[STATE.nuclide];
  $("#ndot").style.color=nuc.color;
  $("#heroNuc").textContent=STATE.nuclide;
  $("#heroNuc").style.color=nuc.color;
}

function initBindings(){
  // nuclide selector
  $("#nuclideSel").addEventListener("change",e=>{
    STATE.nuclide=e.target.value;STATE._scenario="default";
    const d=NUC_DEFAULT[STATE.nuclide];STATE.activity=d.activity;STATE.time=d.time;STATE.bg=d.bg;STATE.gain=0;
    updateNuclideUI();recompute();renderControls();renderHero();renderViz();
  });
  // level segment
  $("#levelSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    $$("#levelSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    STATE.level=b.dataset.lv;TipEngine.setLevel(STATE.level);});
  // scale segment
  $("#scaleSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    $$("#scaleSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    STATE.scale=b.dataset.sc;renderHero();});
  // zoom buttons
  $("#zoomIn").addEventListener("click",()=>CHART.zoom(0.7));
  $("#zoomOut").addEventListener("click",()=>CHART.zoom(1.4));
  $("#zoomReset").addEventListener("click",()=>CHART.reset());
  // snapshot
  $("#snapBtn").addEventListener("click",()=>{
    const a=document.createElement("a");a.download=`spectra_lab_${STATE.nuclide}_${Date.now()}.png`;
    a.href=CHART.cv.toDataURL("image/png");a.click();});
  // help
  $("#helpBtn").addEventListener("click",()=>switchTab("overview"));
  // cursor readout
  CHART.cursorCb=(ch,vals)=>{const cur=$("#heroCursor");
    if(ch==null){cur.style.opacity=0;return;}
    cur.style.opacity=1;
    const E=ch2E(ch);let s=`ch ${Math.round(ch)} · ${E.toFixed(1)} keV`;
    if(vals&&vals["원 스펙트럼"]!=null)s+=` · ${fmtInt(vals["원 스펙트럼"])} cts`;
    cur.textContent=s;};
  // keyboard
  window.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
    const k=e.key;
    if(k>="1"&&k<="9"){const i=+k-1;if(TABS[i])switchTab(TABS[i].id);}
    else if(k==="0"){switchTab(TABS[9].id);}
    else if(k==="+"||k==="="){CHART.zoom(0.7);}
    else if(k==="-"){CHART.zoom(1.4);}
    else if(k==="L"||k==="l"){const order=["beg","mid","adv"];const ni=(order.indexOf(STATE.level)+1)%3;
      STATE.level=order[ni];TipEngine.setLevel(STATE.level);
      $$("#levelSeg button").forEach(x=>x.classList.toggle("on",x.dataset.lv===STATE.level));}
    else if(k===" "&&STATE.activeTab==="locate"){e.preventDefault();const btn=$(".btn.pri");if(btn&&btn.textContent.includes("erosion"))playErosion(btn);}
  });
  // resize
  let rt;const ro=new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{CHART.draw();},80);});
  ro.observe($(".chart-wrap"));
  window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>CHART.draw(),80);});
}

/* ---------- SELF CHECK (console only) ---------- */
window.__SELFCHECK__=function(){
  const fails=[];
  const approx=(a,b,tol,name)=>{const r=Math.abs(a-b)/Math.max(1e-9,Math.abs(b));if(r>tol)fails.push(`${name}: got ${a.toFixed(2)}, exp ${b} (${(r*100).toFixed(1)}%)`);};
  // Cs-137 peak area (no noise for determinism)
  const saveCal={C0:CAL.C0,C1:CAL.C1,a:CAL.a,b:CAL.b};
  CAL.C0=0;CAL.C1=0.5;CAL.a=1.0;CAL.b=1.85;CAL.effFn=fitEfficiency(CAL.effPoints);
  const eps662=effOf(661.7).eps;
  const S=833*0.851*eps662*600; approx(S,5104,0.06,"Cs-137 peak area S");
  // Activity round-trip
  const act=activityCalc(S,Math.sqrt(S),600,eps662,eps662*0.03,0.851,0,{});
  approx(act.A,833,0.06,"Cs-137 activity A");
  // Currie example (sigma0 = sigma_B = 90.9 from doc) → LC≈149.5, LD≈301.8
  const cur=currieMDA(90.9,1.645,600,eps662,0.851,{});
  approx(cur.LC,149.5,0.08,"Currie LC"); approx(cur.LD,301.8,0.08,"Currie LD");
  // Co-60 weighted mean
  const wm=weightedMean([{C:1000,sigma:80},{C:1080,sigma:120}]);
  approx(wm.mean,1024.7,0.02,"Co-60 weighted mean");
  // restore
  Object.assign(CAL,saveCal);CAL.effFn=fitEfficiency(CAL.effPoints);
  if(fails.length===0){console.log("%cSELFCHECK_OK","color:#36d6c3;font-weight:bold");return true;}
  console.warn("SELFCHECK FAILURES:\n"+fails.join("\n"));return false;
};

/* ---------- BOOT ---------- */
function boot(){
  TipEngine.init();TipEngine.setLevel("beg");
  CHART=new SpectrumChart($("#heroCanvas"));
  updateNuclideUI();
  STATE._scenario="default";
  recompute();
  buildTabbar();initBindings();
  renderControls();renderViz();renderHero();
  // run selfcheck shortly after boot
  setTimeout(()=>{try{window.__SELFCHECK__();}catch(err){console.warn("selfcheck error",err);}},200);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
